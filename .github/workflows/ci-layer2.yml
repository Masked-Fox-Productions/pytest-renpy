name: CI Layer 2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RENPY_SDK_VERSION: "8.3.7"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Cache Ren'Py SDK
        uses: actions/cache@v6
        with:
          path: ~/.renpy-sdk/
          key: renpy-sdk-${{ env.RENPY_SDK_VERSION }}

      - name: Fetch Ren'Py SDK
        run: |
          output=$(pytest-renpy fetch-sdk ${{ env.RENPY_SDK_VERSION }})
          echo "$output"
          echo "RENPY_SDK=$(echo "$output" | tail -n 1)" >> "$GITHUB_ENV"

      - name: Run Layer 2 tests
        run: pytest tests/test_engine.py examples/ci-test-game/ --renpy-project=examples/ci-test-game
